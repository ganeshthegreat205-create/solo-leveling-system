<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SYSTEM ONLINE</h1>

    <h2>PLAYER: GANU</h2>
    
    <p>LEVEL: <span id="level">1</span></p>
    <p>XP: <span id="xp">0 / 100</span></p>

    <hr>

    <h2>PLAYER STATS</h2>

    <p>🧠 INT: 10</p>
    <p>💪 STR: 10</p>
    <p>❤️ VIT: 10</p>
    <p>🎯 DISC: 10</p>
    <p>💰 WIS: 10</p>

    <hr>

    <h2>DAILY QUESTS</h2>

    <p onclick="completeQuest(30)">🧠 Study — +30 XP</p>
    <p onclick="completeQuest(20)">💻 Coding / DSA — +20 XP</p>
    <p onclick="completeQuest(20)">💪 Exercise — +20 XP</p>
    <p onclick="completeQuest(15)">❤️ Sleep Target — +15 XP</p>
    <p onclick="completeQuest(10)">🍱 Food Budget — +10 XP</p>
    <p onclick="completeQuest(10)">💰 Avoid Unnecessary Spending — +10 XP</p>
<script src="script.js"></script>
</body>
</html>
